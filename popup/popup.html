<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Don't Procrastinate</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <div class="popup-header">
        <img class="popup-icon" src="../icons/icon.svg" alt="" />

    </div>
    <script src="popup.js"></script>
  </body>
</html>
